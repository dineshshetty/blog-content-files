# Mosquitto — intentionally open. This is the misconfiguration the blog demos.
# anonymous + plaintext 1883 + no ACL = CWE-306 / CWE-319 / CWE-862

listener 1883 0.0.0.0

allow_anonymous true

# No password_file.
# No acl_file.
# No TLS listener.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type notice
